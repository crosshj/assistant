<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Reader - SmartText Database Manager</title>

		<!-- PWA Manifest -->
		<link
			rel="manifest"
			href="./manifest.json"
		/>

		<!-- Theme colors -->
		<meta
			name="theme-color"
			content="#2563eb"
		/>
		<meta
			name="apple-mobile-web-app-capable"
			content="yes"
		/>
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="default"
		/>
		<meta
			name="apple-mobile-web-app-title"
			content="Reader"
		/>

		<!-- Icons -->
		<link
			rel="icon"
			type="image/svg+xml"
			href="./favicon.svg"
		/>
		<link
			rel="apple-touch-icon"
			href="./favicon.svg"
		/>

		<!-- Styles -->
		<link
			rel="stylesheet"
			href="./reader.css"
		/>

		<!-- Prevent zoom on mobile -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
	</head>
	<body>
		<!-- Loading indicator -->
		<div
			id="loading-indicator"
			class="loading-indicator"
		>
			<div class="loading-spinner"></div>
			<p>Loading Reader...</p>
		</div>

		<!-- Main app container -->
		<div
			id="app-container"
			style="display: none"
		>
			<!-- App content will be dynamically inserted here -->
		</div>

		<!-- Service Worker Registration -->
		<script>
			// Register service worker
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', async () => {
					try {
						const registration =
							await navigator.serviceWorker.register('./sw.js');
						console.log(
							'Service Worker registered successfully:',
							registration
						);

						// Handle updates
						registration.addEventListener('updatefound', () => {
							const newWorker = registration.installing;
							newWorker.addEventListener('statechange', () => {
								if (
									newWorker.state === 'installed' &&
									navigator.serviceWorker.controller
								) {
									// New content is available, show update notification
									if (
										confirm(
											'New version available. Reload to update?'
										)
									) {
										window.location.reload();
									}
								}
							});
						});
					} catch (error) {
						console.error(
							'Service Worker registration failed:',
							error
						);
					}
				});
			}

			// Handle file opening from system
			window.addEventListener('message', (event) => {
				if (event.data && event.data.type === 'FILE_OPENED') {
					console.log('File opened from system:', event.data.file);
					// Handle the opened file
					if (window.handleFileOpen) {
						window.handleFileOpen(event.data.file);
					}
				}
			});

			// Handle beforeinstallprompt for PWA installation
			let deferredPrompt;
			window.addEventListener('beforeinstallprompt', (e) => {
				console.log('PWA install prompt available');
				e.preventDefault();
				deferredPrompt = e;

				// Show install button or notification
				showInstallPrompt();
			});

			function showInstallPrompt() {
				// You can add UI to show install prompt
				console.log('PWA can be installed');
			}

			// Handle app installation
			window.addEventListener('appinstalled', () => {
				console.log('PWA was installed');
				deferredPrompt = null;
			});

			// Show loading indicator initially
			document.addEventListener('DOMContentLoaded', () => {
				const loadingIndicator =
					document.getElementById('loading-indicator');
				const appContainer = document.getElementById('app-container');

				// Hide loading indicator and show app after a short delay
				setTimeout(() => {
					loadingIndicator.style.display = 'none';
					appContainer.style.display = 'block';
				}, 1000);
			});
		</script>

		<!-- Main app script -->
		<script
			type="module"
			src="./reader.js"
		></script>
	</body>
</html>
