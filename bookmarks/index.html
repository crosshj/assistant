<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Bookmarks</title>
		<meta
			name="color-scheme"
			content="light dark"
		/>
		<link
			rel="icon"
			type="image/svg+xml"
			href="/favicon.svg"
		/>
		<link
			rel="manifest"
			href="/manifest.json"
		/>
		<style>
			.icon-font-loading .material-symbols-outlined {
				color: transparent !important;
				transition: color 0.1s;
			}
			/* Hide content until styles are loaded to prevent FOUC */
			body {
				visibility: hidden;
			}
			body.styles-loaded {
				visibility: visible;
			}
		</style>
	</head>
	<body>
		<div class="page-header">
			<h1 style="display: flex; align-items: center; gap: 0.3em">
				<button
					id="menuBtn"
					class="icon-btn mobile-only"
					aria-label="Open menu"
					style="
						margin-right: 0.1em;
						padding: 0;
						display: flex;
						align-items: center;
					"
				>
					<svg
						width="24"
						height="24"
						viewBox="0 0 24 24"
						fill="none"
						xmlns="http://www.w3.org/2000/svg"
						aria-hidden="true"
						focusable="false"
					>
						<rect
							x="3"
							y="5.5"
							width="18"
							height="2.5"
							fill="currentColor"
						/>
						<rect
							x="3"
							y="10.75"
							width="18"
							height="2.5"
							fill="currentColor"
						/>
						<rect
							x="3"
							y="16"
							width="18"
							height="2.5"
							fill="currentColor"
						/>
					</svg>
				</button>
				<span class="header-icon">
					<img
						src="/favicon.svg"
						alt="Bookmarks icon"
						class="header-icon"
						width="32"
						height="32"
					/>
				</span>
				<span class="header-title-text">Bookmarks</span>
			</h1>
			<div
				id="header-actions"
				class="action-buttons"
			>
				<button
					id="addBookmarkBtn"
					class="btn btn-primary icon-btn"
					title="Add Bookmark"
				>
					<svg
						width="22"
						height="22"
						viewBox="0 0 22 22"
						fill="none"
						xmlns="http://www.w3.org/2000/svg"
						aria-hidden="true"
						focusable="false"
						style="display: block"
					>
						<circle
							cx="11"
							cy="11"
							r="10"
							stroke="currentColor"
							stroke-width="1.5"
							fill="none"
						/>
						<path
							d="M11 6v10M6 11h10"
							stroke="currentColor"
							stroke-width="1.5"
							stroke-linecap="round"
						/>
					</svg>
				</button>
			</div>
		</div>
		<section id="bookmarks-section">
			<div
				class="card-grid"
				id="bookmarksGrid"
			>
				<div class="card loading-card">
					<div
						class="card-inner"
						style="
							justify-content: center;
							align-items: center;
							min-height: 180px;
						"
					>
						<div class="spinner"></div>
					</div>
				</div>
			</div>
		</section>
		<div
			id="addBookmarkModal"
			class="modal"
		>
			<div class="modal-content">
				<div class="modal-header">
					<h2>Add New Bookmark</h2>
					<span class="close">&times;</span>
				</div>
				<div class="modal-body">
					<form id="addBookmarkForm">
						<div class="form-group">
							<label for="urlInput">URL:</label>
							<input
								type="url"
								id="urlInput"
								required
								placeholder="https://example.com"
							/>
						</div>
						<div
							class="form-group"
							style="display: none"
						>
							<label for="tagsInput"
								>Tags (comma-separated):</label
							>
							<input
								type="text"
								id="tagsInput"
								placeholder="tech, programming, tutorial"
							/>
						</div>
						<div class="form-actions">
							<button
								type="button"
								class="btn btn-secondary"
								id="cancelBtn"
							>
								Cancel
							</button>
							<button
								type="submit"
								class="btn btn-primary"
							>
								Add Bookmark
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>
		<div
			id="editBookmarkModal"
			class="modal"
		>
			<div class="modal-content">
				<div class="modal-header">
					<h2>Edit Bookmark</h2>
					<span class="close">&times;</span>
				</div>
				<div class="modal-body">
					<form id="editBookmarkForm">
						<input
							type="hidden"
							id="editId"
						/>
						<div class="form-group">
							<label for="editUrl">URL:</label>
							<input
								type="url"
								id="editUrl"
								required
							/>
						</div>
						<div class="form-group">
							<label for="editTitle">Title:</label>
							<input
								type="text"
								id="editTitle"
								required
							/>
						</div>
						<div class="form-group">
							<label for="editDescription">Description:</label>
							<textarea
								id="editDescription"
								rows="3"
							></textarea>
						</div>
						<div
							class="form-group"
							style="display: none"
						>
							<label for="editTags">Tags:</label>
							<input
								type="text"
								id="editTags"
								placeholder="tech, programming, tutorial"
							/>
						</div>
						<div
							class="form-group"
							style="display: none"
						>
							<label
								><input
									type="checkbox"
									id="editReadStatus"
								/>
								Mark as read</label
							>
						</div>
						<div
							class="form-group"
							style="display: none"
						>
							<label
								><input
									type="checkbox"
									id="editFavorite"
								/>
								Mark as favorite</label
							>
						</div>
						<div class="form-actions">
							<button
								type="button"
								class="btn btn-secondary"
								id="editCancelBtn"
							>
								Cancel
							</button>
							<button
								type="submit"
								class="btn btn-primary"
							>
								Save Changes
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>
		<!-- Inconspicuous build meta footer -->
		<footer
			id="build-meta-footer"
			style="
				text-align: center;
				font-size: 0.8em;
				color: #888;
				margin: 2em 0 0 0;
			"
		></footer>
		<!-- Main JS entry -->
		<script
			type="module"
			src="/src/index.js"
		></script>
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', function () {
					navigator.serviceWorker.register('/sw.js');
				});
			}
			// Add build meta to footer
			window.addEventListener('DOMContentLoaded', function () {
				const footer = document.getElementById('build-meta-footer');
				if (footer && window.BUILD_DATE && window.PACKAGE_VERSION) {
					const d = new Date(window.BUILD_DATE);
					const pad = (n) => n.toString().padStart(2, '0');
					const formatted = `${d.getFullYear()}-${pad(
						d.getMonth() + 1
					)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(
						d.getMinutes()
					)}`;
					footer.textContent = `v${window.PACKAGE_VERSION} | built ${formatted}`;
				}
			});
		</script>
	</body>
</html>
