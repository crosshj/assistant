<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1"
		/>
		<meta
			name="color-scheme"
			content="light dark"
		/>
		<title>GunDB Collaborative Graph</title>
		<link
			rel="icon"
			type="image/svg+xml"
			href="/favicon.svg"
		/>
		<style>
			/* Hide content until styles are loaded to prevent FOUC */
			body {
				visibility: hidden;
			}
			body.styles-loaded {
				visibility: visible;
			}
		</style>
	</head>
	<body>
		<!-- Header container - components will render here -->
		<header id="header-container"></header>

		<!-- Main grid container -->
		<div
			class="grid"
			id="mainGrid"
		>
			<!-- Left pane container -->
			<div id="left-pane"></div>

			<!-- Right pane container -->
			<div id="right-pane"></div>
		</div>

		<script
			type="module"
			src="/src/gun/gun.js"
		></script>
	</body>
</html>
