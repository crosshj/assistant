<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1"
		/>
		<meta
			name="color-scheme"
			content="light dark"
		/>
		<title>GunDB Collaborative Graph</title>
		<link
			rel="icon"
			type="image/svg+xml"
			href="/favicon.svg"
		/>
		<link
			rel="stylesheet"
			href="/src/gun/gun.css"
		/>
		<style>
			/* Hide content until styles are loaded to prevent FOUC */
			body {
				visibility: hidden;
			}
			body.styles-loaded {
				visibility: visible;
			}
		</style>
	</head>
	<body>
		<header>
			<div class="row">
				<!-- Network/Connection Section (FIRST position - always visible) -->
				<div
					class="row-item"
					id="networkSection"
					style="display: flex; gap: 0.5rem; align-items: center"
				>
					<strong>Network</strong>

					<!-- Connection Status (always visible) -->
					<span
						class="pill mono"
						id="connectionStatus"
						title="Connection status"
					>
						Connecting...
					</span>

					<!-- Connection Controls (shown conditionally) -->
					<div
						id="connectionControls"
						style="display: none"
					>
						<input
							id="peers"
							size="40"
							placeholder="Peer URLs"
						/>
					</div>

					<!-- Connect Button (shown when disconnected or partial) -->
					<button
						id="connectBtn"
						class="primary"
						style="display: none"
					>
						Connect
					</button>

					<!-- Disconnect Button (shown when connected) -->
					<button
						id="disconnectBtn"
						class="secondary"
						style="display: none"
					>
						Disconnect
					</button>

					<!-- Test Button (shown when needed) -->
					<button
						id="testConnection"
						class="secondary"
						style="display: none"
					>
						Test
					</button>
				</div>

				<div class="header-divider"></div>

				<!-- Room Management Section (SECOND position, hidden when not connected) -->
				<div
					class="row-item"
					id="roomSection"
					style="
						display: flex;
						visibility: hidden;
						gap: 0.5rem;
						align-items: center;
						justify-content: center;
					"
				>
					<strong>Room</strong>
					<input
						id="room"
						size="14"
						placeholder="graph-room"
					/>
					<span
						class="pill mono"
						id="roomStatus"
						title="Room status"
						>not joined</span
					>
					<button
						id="join"
						class="primary"
					>
						Join
					</button>
				</div>
				<div
					class="header-divider"
					id="roomDivider"
					style="visibility: hidden"
				></div>

				<!-- Authentication Section (hidden when not connected) -->
				<div
					class="row-item"
					id="authSection"
					style="
						display: flex;
						visibility: hidden;
						align-items: center;
						gap: 0.5rem;
						justify-content: flex-end;
					"
				>
					<strong>Identity</strong>
					<input
						id="alias"
						size="10"
						placeholder="alias"
					/>
					<button id="createPair">New ID</button>
					<button id="login">Login</button>
					<span
						class="pill mono"
						id="whoami"
						>anon</span
					>
				</div>
			</div>
		</header>

		<div class="grid">
			<section class="card">
				<header><h3 style="margin: 0">Edit</h3></header>
				<div class="body">
					<details open>
						<summary><b>New node</b></summary>
						<div
							class="row"
							style="margin: 0.5rem 0"
						>
							<input
								id="nodeId"
								class="mono"
								placeholder="node id (auto if blank)"
							/>
							<input
								id="nodeLabel"
								placeholder="label"
							/>
						</div>
						<label>Props (JSON object)</label>
						<textarea
							id="nodeProps"
							class="mono"
							rows="5"
							placeholder='{"url":"https://example.com","tags":["link"],"note":"..."}'
						></textarea>
						<div class="row">
							<button
								id="addNode"
								class="primary"
							>
								Upsert node
							</button>
							<button id="delNode">Delete node</button>
						</div>
					</details>
					<hr style="border-color: #2a323a" />
					<details open>
						<summary><b>New edge</b></summary>
						<div
							class="row"
							style="margin: 0.5rem 0"
						>
							<input
								id="edgeId"
								class="mono"
								placeholder="edge id (auto if blank)"
							/>
							<input
								id="edgeFrom"
								class="mono"
								placeholder="from id"
							/>
							<input
								id="edgeTo"
								class="mono"
								placeholder="to id"
							/>
							<input
								id="edgeLabel"
								placeholder="label"
							/>
						</div>
						<label>Props (JSON object)</label>
						<textarea
							id="edgeProps"
							class="mono"
							rows="4"
							placeholder='{"weight":1}'
						></textarea>
						<div class="row">
							<button
								id="addEdge"
								class="primary"
							>
								Upsert edge
							</button>
							<button id="delEdge">Delete edge</button>
						</div>
					</details>
					<hr style="border-color: #2a323a" />
					<div class="row">
						<button id="exportBtn">Export JSON</button>
						<input
							type="file"
							id="importFile"
							accept="application/json"
						/>
						<button id="clearLocal">Clear local cache</button>
					</div>
					<p class="note">
						Data model: <code>graphs/{room}/nodes/{id}</code> and
						<code>graphs/{room}/edges/{id}</code>.
					</p>
				</div>
			</section>

			<section class="card">
				<header><h3 style="margin: 0">Graph</h3></header>
				<div
					class="body"
					style="padding: 0; flex: 1"
				>
					<div
						style="
							padding: 0.5rem 0.75rem;
							border-bottom: 1px solid #30363d;
						"
					>
						<div class="row">
							<input
								id="searchNode"
								placeholder="Search nodes..."
								style="flex: 1"
							/>
							<button id="clearSearch">Clear</button>
							<select id="layoutSelect">
								<option value="cose">Force-directed</option>
								<option value="grid">Grid</option>
								<option value="circle">Circle</option>
								<option value="concentric">Concentric</option>
							</select>
							<button id="fitGraph">Fit</button>
						</div>
					</div>
					<div
						style="
							padding: 0.5rem 0.75rem;
							border-bottom: 1px solid #30363d;
						"
					>
						<div>
							<b>Selected</b>
							<button
								id="loadProps"
								class="secondary"
								style="margin: 0.5rem 0; font-size: 0.8rem"
							>
								Load Props from GunDB
							</button>
							<pre
								id="sel"
								class="mono"
								style="
									white-space: pre-wrap;
									margin: 0.5rem 0 0 0;
									font-size: 0.85rem;
								"
							></pre>
						</div>
					</div>
					<div id="cy"></div>
				</div>
			</section>

			<aside class="card">
				<header
					style="
						display: flex;
						justify-content: space-between;
						align-items: center;
					"
				>
					<h3 style="margin: 0">Activity</h3>
					<div
						style="display: flex; gap: 0.5rem; align-items: center"
					>
						<button
							id="copyLog"
							class="secondary"
							style="
								border: none;
								background: transparent;
								padding: 0.5rem;
								cursor: pointer;
								border-radius: 4px;
								transition: background-color 0.2s;
							"
							title="Copy activity log to clipboard"
							onmouseover="this.style.backgroundColor='rgba(255,255,255,0.1)'"
							onmouseout="this.style.backgroundColor='transparent'"
						>
							<svg
								width="18"
								height="18"
								viewBox="0 0 24 24"
								fill="currentColor"
							>
								<!-- Back document (filled, slightly offset) -->
								<path
									d="M15 0H3c-1.1 0-2 .9-2 2v14h2V2h12V0z"
									fill="currentColor"
								/>
								<!-- Front document (solid/filled) -->
								<path
									d="M19 5H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2z"
									fill="currentColor"
								/>
							</svg>
						</button>
						<button
							id="clearLog"
							class="secondary"
							style="
								border: none;
								background: transparent;
								padding: 0.5rem;
								cursor: pointer;
								border-radius: 4px;
								transition: background-color 0.2s;
							"
							title="Clear activity log"
							onmouseover="this.style.backgroundColor='rgba(255,255,255,0.1)'"
							onmouseout="this.style.backgroundColor='transparent'"
						>
							<svg
								width="22"
								height="22"
								viewBox="0 0 24 24"
								fill="currentColor"
							>
								<!-- Trash can body -->
								<path
									d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12z"
								/>
								<!-- Trash can lid -->
								<path d="M19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
								<!-- Trash can opening -->
								<path d="M8 9h8v1H8V9z" />
							</svg>
						</button>
					</div>
				</header>
				<div class="body">
					<ul
						id="log"
						class="list"
					></ul>
				</div>
			</aside>
		</div>

		<script
			type="module"
			src="/src/gun/gun.js"
		></script>
	</body>
</html>
